const K = "fc-spiegel-key-" + P.salt;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function schluessel(pw) {
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter},
    basis, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
async function oeffnen(key) {
  const roh = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
  const s = new Blob([roh]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html = await new Response(s).text();
  document.open(); document.write(html); document.close();
}
async function gemerkt() {
  const roh = localStorage.getItem(K) || sessionStorage.getItem(K);
  if (!roh) return false;
  try {
    const key = await crypto.subtle.importKey("raw", b64(roh), "AES-GCM", false, ["decrypt"]);
    await oeffnen(key); return true;
  } catch (e) { localStorage.removeItem(K); sessionStorage.removeItem(K); return false; }
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const msg = document.getElementById("msg");
  msg.style.color = "#9fb0c5"; msg.textContent = "Entschlüssle …";
  try {
    const key = await schluessel(document.getElementById("pw").value.trim());
    const roh = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    const k64 = btoa(String.fromCharCode(...roh));
    await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
    sessionStorage.setItem(K, k64);
    if (document.getElementById("merken").checked) localStorage.setItem(K, k64);
    await oeffnen(key);
  } catch (e) { msg.style.color = "#f87171"; msg.textContent = "Passwort falsch."; }
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
gemerkt().then(ok => { if (!ok) document.getElementById("box").hidden = false; });
})();
